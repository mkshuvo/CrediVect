name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Core API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -count=1 ./...
      # The in-process cost of the request path. Benchmarks are reported rather
      # than asserted: the number that matters is the end-to-end one the e2e job
      # measures against the scoring SLA, and a regression in CPU work shows up
      # here as a reviewable diff rather than a flaky threshold.
      - name: bench
        run: go test -run '^$' -bench=. -benchmem -benchtime=1000x ./internal/...

  scoring:
    name: Scoring engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image trains the model during the build when the artifacts are
      # missing, so this also proves a clean clone can reach a serving container.
      - name: Build the scoring image
        run: docker build -t credivect-scoring ./services/scoring
      - name: Engine tests
        run: docker run --rm credivect-scoring python -m unittest discover -s tests -t . -v

  ui:
    name: Console (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ui/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CORE_ORIGIN: http://core:8000

  compose:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the stack definition
        run: docker compose config --quiet

  # One complete loan through the real stack, over HTTP, with the real Temporal
  # saga and the real Python engine. Every other job here tests a component;
  # this one tests the product, and it is the only place the sub-50ms claim, the
  # FCRA notice and the three read capacities are checked together.
  e2e:
    name: End-to-end loan (live stack)
    runs-on: ubuntu-latest
    needs: [go, scoring]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      # The model artifacts are reproducible from a fixed seed and deliberately
      # not committed, and core reads the trained histogram as its PSI baseline,
      # so training has to happen before anything starts.
      - name: Build the scoring engine and train its artifacts
        run: |
          docker compose build scoring
          docker compose run --rm trainer
      - name: Start the stack
        run: docker compose up -d --build postgres dragonfly redpanda temporal scoring core ingest
      - name: Wait for every dependency to report UP
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/api/v1/health | grep -q '"scoring":"UP"'; then
              echo "stack is up"; exit 0
            fi
            sleep 5
          done
          docker compose logs core scoring temporal
          exit 1
      - name: Seed accounts and a scored application book
        run: docker compose run --rm seed
      - name: Run the end-to-end validation
        working-directory: services/core
        env:
          CORE_URL: http://localhost:8000
          E2E_DECISION_TIMEOUT: 120s
        run: go run ./cmd/e2e
