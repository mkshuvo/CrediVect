services:
  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      args:
        # The rewrite destination is baked into the standalone build at image
        # build time, so it is a build arg rather than a runtime env. Core
        # always listens on 8000 inside the compose network.
        - CORE_ORIGIN=http://core:8000
    container_name: credivect-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Browser talks to the UI origin only; the Next server proxies /api/v1/*
      # to CORE_ORIGIN. NEXT_PUBLIC_API_URL stays supported for direct-mode
      # (no proxy) builds.
      - CORE_ORIGIN=http://core:8000
      - NEXT_PUBLIC_AUTH_PROVIDER=local
      - NODE_ENV=production
    depends_on:
      - core

  # =========================================================================
  # 2. GOLANG CORE API GATEWAY, UNDERWRITING SAGA WORKER, EVENT PRODUCER
  # =========================================================================
  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: credivect-core
    restart: unless-stopped
    ports:
      - "${CORE_HOST_PORT:-8000}:8000"
    environment:
      - PORT=8000
      # local verifies sessions this service minted from its own secret. oidc
      # adds an external identity provider beside it, so seeded staff accounts
      # and borrower logins keep working while staff also sign in with the
      # company directory.
      - AUTH_MODE=${AUTH_MODE:-local}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:-}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-credivect-api}
      - OIDC_ROLE_CLAIM=${OIDC_ROLE_CLAIM:-role}
      - OIDC_KEY_TTL=${OIDC_KEY_TTL:-5m}
      - OIDC_ALLOW_CLEARTEXT_KEYS=${OIDC_ALLOW_CLEARTEXT_KEYS:-false}
      - JWT_SECRET=${JWT_SECRET:-credivect-super-secure-local-jwt-secret-key-32bytes!}
      - SSN_ENCRYPTION_KEY=${SSN_ENCRYPTION_KEY:-01918a2b4c5d7e6f00112233445566778899aabbccddeeff0011223344556677}
      - DRAGONFLY_URL=redis://dragonfly:6379/0
      - POSTGRES_URL=postgres://credivect_user:credivect_password@postgres:5432/credivect?sslmode=disable
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=credivect.application.events
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=credivect-underwriting
      - SCORING_GRPC_HOST=scoring:50051
      - SCORING_TIMEOUT=2s
      - ALLOWED_ORIGINS=http://localhost:3000
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-60}
      - PSI_BASELINE_FILE=/etc/credivect/models/baseline_deciles.json
      - BUREAU_LATENCY_MS=${BUREAU_LATENCY_MS:-0}
      - BUREAU_FAILURE_RATE=${BUREAU_FAILURE_RATE:-0}
      - BUREAU_NAME=${BUREAU_NAME:-CREDIVECT-SIM}
      # Identity printed on the FCRA adverse action notice; a real deployment
      # supplies its own creditor and reporting-agency details.
      - NOTICE_CREDITOR_NAME=${NOTICE_CREDITOR_NAME:-CrediVect Lending Inc.}
      - NOTICE_CREDITOR_ADDRESS=${NOTICE_CREDITOR_ADDRESS:-1400 K Street NW Suite 900, Washington, DC 20005}
      - NOTICE_CRA_ADDRESS=${NOTICE_CRA_ADDRESS:-P.O. Box 105025, Atlanta, GA 30348}
    volumes:
      # The trained artifact histogram is the PSI baseline, read from the
      # scoring model directory so governance measures against the shipped model.
      - ./services/scoring/engine/models:/etc/credivect/models:ro
    # Lets an identity provider running on the developer's machine, outside this
    # network, be reached by name from inside the container on Linux as well as
    # on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      scoring:
        condition: service_healthy
      redpanda:
        condition: service_started
      temporal:
        condition: service_started

  # =========================================================================
  # 3b. ONE-OFF SEED RUNNER (make seed): originates a real scored book
  # =========================================================================
  seed:
    image: credivect-core:latest
    container_name: credivect-seed
    profiles: ["tools"]
    entrypoint: ["/app/credivect-seed"]
    command: ["-applications", "${SEED_APPLICATIONS:-240}"]
    environment:
      - JWT_SECRET=${JWT_SECRET:-credivect-super-secure-local-jwt-secret-key-32bytes!}
      - SSN_ENCRYPTION_KEY=${SSN_ENCRYPTION_KEY:-01918a2b4c5d7e6f00112233445566778899aabbccddeeff0011223344556677}
      - DRAGONFLY_URL=redis://dragonfly:6379/0
      - POSTGRES_URL=postgres://credivect_user:credivect_password@postgres:5432/credivect?sslmode=disable
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=credivect.application.events
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=credivect-underwriting
      - SCORING_GRPC_HOST=scoring:50051
      - PSI_BASELINE_FILE=/etc/credivect/models/baseline_deciles.json
    volumes:
      - ./services/scoring/engine/models:/etc/credivect/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      scoring:
        condition: service_healthy
      temporal:
        condition: service_started
      redpanda:
        condition: service_started

  # =========================================================================
  # 3b2. ONE-OFF MODEL RETRAINER (make train). The trained artifacts under
  # services/scoring/engine/models are reproducible from a fixed seed and are not
  # committed, so a clean checkout regenerates them here; the bind mount writes
  # them back to the working tree, which is also where core reads its PSI
  # baseline from.
  # =========================================================================
  trainer:
    image: credivect-scoring:latest
    container_name: credivect-trainer
    profiles: ["tools"]
    entrypoint: ["python", "-m", "engine.train"]
    volumes:
      - ./services/scoring/engine/models:/app/engine/models

  # =========================================================================
  # 3c. EVENT STREAM CONSUMER: Kafka -> application_events read model
  # =========================================================================
  ingest:
    image: credivect-core:latest
    container_name: credivect-ingest
    restart: unless-stopped
    entrypoint: ["/app/credivect-ingest"]
    ports:
      # Read model of the stream: GET /events, GET /health.
      - "${INGEST_HOST_PORT:-8090}:8090"
    environment:
      - INGEST_PORT=8090
      - JWT_SECRET=${JWT_SECRET:-credivect-super-secure-local-jwt-secret-key-32bytes!}
      - SSN_ENCRYPTION_KEY=${SSN_ENCRYPTION_KEY:-01918a2b4c5d7e6f00112233445566778899aabbccddeeff0011223344556677}
      - POSTGRES_URL=postgres://credivect_user:credivect_password@postgres:5432/credivect?sslmode=disable
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=credivect.application.events
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started

  scoring:
    build:
      context: ./services/scoring
      dockerfile: Dockerfile
    container_name: credivect-scoring
    restart: unless-stopped
    ports:
      - "50051:50051"

  postgres:
    image: postgres:17-alpine3.21
    container_name: credivect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: credivect
      POSTGRES_USER: credivect_user
      POSTGRES_PASSWORD: credivect_password
    ports:
      # Movable like the other host ports: another local stack may already own 5432.
      # Services reach postgres as postgres:5432 on the compose network regardless.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credivect_user -d credivect"]
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    container_name: credivect-dragonfly
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    command: ["--proactor_threads=4", "--cache_mode=true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    container_name: credivect-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=1G
    ports:
      # Only the external listener is published; services use redpanda:9092 on the
      # compose network. The internal 9092/9644 host mappings were redundant and
      # conflicted with Windows dynamic port reservations on the dev machine.
      - "${KAFKA_EXTERNAL_HOST_PORT:-19092}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    container_name: credivect-redpanda-console
    restart: unless-stopped
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "${REDPANDA_CONSOLE_HOST_PORT:-8080}:8080"

  temporal:
    image: temporalio/auto-setup:1.29.6
    container_name: credivect-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=credivect_user
      - POSTGRES_PWD=credivect_password
      - POSTGRES_SEEDS=postgres
    ports:
      - "${TEMPORAL_HOST_PORT:-7233}:7233"

  temporal-ui:
    image: temporalio/ui:2.53.3
    container_name: credivect-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-8233}:8080"

  # =========================================================================
  # 11. KEYCLOAK - a real, self-hosted OIDC provider
  # =========================================================================
  # Exercises the delegated-identity path against an actual enterprise provider
  # rather than cmd/dev-idp, which is a test fixture. Apache-2.0, so it costs
  # nothing and needs no external account or tenant.
  #
  # Held behind a profile because it is the heaviest container here: the demo
  # stack does not pay its startup cost unless delegated sign-in is wanted.
  #   docker compose --profile idp up -d keycloak
  #
  # Note how the issuer ends up being set. Keycloak derives `iss` from the host
  # in the request, so a token minted by a browser on this machine carries
  # http://localhost:8180/realms/credivect -- that exact string is what
  # OIDC_ISSUER must say, whichever URL core uses to fetch the keys. The
  # `--issuer` build option does not override it here, which is why it is absent.
  # The realm is re-imported on every boot, so no volume is needed.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: credivect-keycloak
    profiles: ["idp"]
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=credivect-keycloak
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./scripts/keycloak-realm.json:/opt/keycloak/data/import/credivect-realm.json:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"

volumes:
  postgres_data:
  dragonfly_data:
  redpanda_data:
